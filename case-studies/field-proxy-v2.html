<style>
/* ===================== ROOT & DESIGN SYSTEM ===================== */
:root {
  --color-black: #0a0a0a;
  --color-white: #ffffff;
  --color-gray-50: #f9fafb;
  --color-gray-100: #f3f4f6;
  --color-gray-200: #e5e7eb;
  --color-gray-300: #d1d5db;
  --color-gray-400: #9ca3af;
  --color-gray-600: #4b5563;
  --color-gray-700: #374151;
  --color-gray-900: #111827;
  
  --color-accent: #3B3EF7;
  --color-accent-light: #eef0fe;
  --color-accent-dark: #2e30c4;
  
  --color-green: #10b981;
  --color-green-light: #d1fae5;
  --color-orange: #f59e0b;
  --color-orange-light: #fef3c7;
  --color-red: #ef4444;
  --color-red-light: #fee2e2;
  
  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
  --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
  
  --size-xs: 0.75rem;
  --size-sm: 0.875rem;
  --size-base: 1rem;
  --size-lg: 1.125rem;
  --size-xl: 1.25rem;
  --size-2xl: 1.5rem;
  --size-3xl: 1.875rem;
  --size-4xl: 2.25rem;
  --size-5xl: 3rem;
  
  --leading-tight: 1.2;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;
  
  --track-tight: -0.01em;
  --track-normal: 0em;
  --track-wide: 0.02em;
  
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  
  --spacing-0: 0;
  --spacing-1: 0.25rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-6: 1.5rem;
  --spacing-8: 2rem;
  --spacing-10: 2.5rem;
  --spacing-12: 3rem;
  --spacing-16: 4rem;
  --spacing-20: 5rem;
  --spacing-24: 6rem;
  --spacing-32: 8rem;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  overflow-x: clip;
}

body {
  background: var(--color-white);
  color: var(--color-gray-700);
  font-family: var(--font-sans);
  font-size: var(--size-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
  max-width: 100%;
}

/* ===================== MATERIAL ICONS STYLING ===================== */
.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24;
  vertical-align: middle;
  user-select: none;
}

img,
video,
canvas,
iframe {
  max-width: 100%;
  height: auto;
  display: block;
}

/* ===================== TYPOGRAPHY ===================== */
h1, h2, h3, h4, h5, h6 {
  font-weight: 700;
  line-height: var(--leading-tight);
  color: var(--color-black);
}

h1 { font-size: var(--size-5xl); letter-spacing: var(--track-tight); }
h2 { font-size: var(--size-4xl); letter-spacing: var(--track-tight); }
h3 { font-size: var(--size-2xl); letter-spacing: var(--track-tight); }
h4 { font-size: var(--size-xl); }
h5 { font-size: var(--size-lg); }
h6 { font-size: var(--size-base); font-weight: 600; }

p { margin-bottom: var(--spacing-4); }
p:last-child { margin-bottom: 0; }

a {
  color: var(--color-accent);
  text-decoration: none;
  transition: color 0.2s;
}

a:hover {
  color: var(--color-accent-dark);
}

strong {
  font-weight: 700;
  color: var(--color-black);
}

/* ===================== NAV (matches home page) ===================== */
.nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(255,255,255,0.92);
  -webkit-backdrop-filter: saturate(160%) blur(16px);
  backdrop-filter: saturate(160%) blur(16px);
  border-bottom: 1px solid #e4e7ee;
  box-shadow: 0 1px 0 rgba(255,255,255,0.9), 0 8px 32px rgba(0,0,0,0.04);
}
.shell {
  width: 100%; max-width: 1280px; margin: 0 auto;
  padding: 0 var(--spacing-8); box-sizing: border-box;
}
.nav-row { height: 70px; display: flex; align-items: center; gap: 22px; }
.brand {
  display: inline-flex; align-items: baseline; gap: 11px;
  font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
  text-decoration: none; color: inherit;
}
.brand .mark {
  width: 11px; height: 11px; border-radius: 3px; background: #1447E6;
  align-self: center; box-shadow: 0 0 18px rgba(20,71,230,0.55);
}
.brand .nm { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: #0e1116; }
.brand small {
  font-family: "Space Mono", ui-monospace, monospace; font-size: 10px; color: #99a1af;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.nav-spacer { flex: 1; }
.nav-links { display: flex; gap: 26px; }
.nav-links a {
  font-size: 13.5px; color: #3c4350; font-weight: 500;
  font-family: "Space Mono", ui-monospace, monospace; letter-spacing: 0.04em;
  text-transform: uppercase; transition: color .2s ease; text-decoration: none;
}
.nav-links a:hover { color: #1447E6; }

/* Hamburger */
.nav-hamburger {
  display: none; width: 40px; height: 40px; flex-shrink: 0;
  border: 1px solid #d0d7e1; border-radius: 10px;
  background: transparent; color: #0e1116; cursor: pointer;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 5px; padding: 11px;
  transition: border-color .2s ease;
}
.nav-hamburger:hover { border-color: #1447E6; }
.hb {
  display: block; width: 16px; height: 1.5px;
  background: #0e1116; border-radius: 2px;
  transition: transform .3s ease, opacity .3s ease, width .3s ease;
}
.nav-hamburger.open .hb:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-hamburger.open .hb:nth-child(2) { opacity: 0; width: 0; }
.nav-hamburger.open .hb:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* Mobile Nav Drawer */
.mobile-nav-drawer {
  display: none; position: fixed; top: 70px; left: 0; right: 0; z-index: 55;
  background: rgba(255,255,255,0.97);
  -webkit-backdrop-filter: saturate(160%) blur(20px);
  backdrop-filter: saturate(160%) blur(20px);
  border-bottom: 1px solid #e4e7ee; flex-direction: column;
}
.mobile-nav-drawer.open { display: flex; }
.mobile-nav-drawer a {
  font-family: "Space Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em;
  text-transform: uppercase; font-weight: 700; color: #3c4350;
  padding: 17px clamp(22px, 5.5vw, 104px);
  border-bottom: 1px solid #e4e7ee;
  display: flex; align-items: center; justify-content: space-between;
  transition: color .2s, background .2s; text-decoration: none;
}
.mobile-nav-drawer a::after { content: "→"; opacity: .35; font-size: 0.85em; }
.mobile-nav-drawer a:last-child { border-bottom: 0; }
.mobile-nav-drawer a:hover { color: #1447E6; background: rgba(20,71,230,0.05); }
.mobile-nav-cta { color: #1447E6 !important; }
.mobile-nav-cta .pulse { margin-right: 8px; }
.nav .pulse { width: 7px; height: 7px; border-radius: 50%; background: #1447E6; position: relative; display: inline-block; }
.nav .pulse::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: #1447E6; animation: nav-pulse 2s ease infinite;
}
@keyframes nav-pulse { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(3); opacity: 0; } }

/* ===================== LAYOUT ===================== */
.cs-layout {
  position: relative;
  display: block;
}

/* NEW CONTENT LAYOUT WITH TOC */
.content-layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 48px;
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0 var(--spacing-8);
  align-items: start;
  box-sizing: border-box;
  overflow: visible;
}

.content-wrapper {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: visible;
}


/* ===================== TOC ===================== */
.cs-toc {
  position: sticky;
  top: 120px;
  height: max-content;
  align-self: start;
  padding: var(--spacing-6);
  background: var(--color-white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-gray-100);
  z-index: 30;
  transition: opacity 0.3s ease;
}

.toc-nav {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
}

.toc-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-4);
  font-size: var(--size-xs);
  font-weight: 600;
  color: var(--color-gray-600);
  border-left: 2px solid var(--color-gray-200);
  border-radius: 0 6px 6px 0;
  transition: all 0.2s;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}

.toc-item:hover {
  color: var(--color-black);
  border-left-color: var(--color-accent);
  background: rgba(59, 62, 247, 0.03);
}

.toc-item.active {
  color: var(--color-accent);
  border-left-color: var(--color-accent);
  background: rgba(59, 62, 247, 0.05);
  font-weight: 700;
}

.toc-num {
  font-size: var(--size-xs);
  font-weight: 700;
  color: inherit;
  opacity: 0.6;
  min-width: 16px;
}

.toc-label {
  letter-spacing: var(--track-wide);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

main {
  margin-top: 0;
  padding-top: 0;
  width: 100%;
  min-width: 0;
}

/* ===================== HERO ===================== */
.cs-hero {
  margin-top: 0;
  padding: 0 var(--spacing-8) var(--spacing-24) var(--spacing-8);
  background: linear-gradient(180deg, 
    rgba(59, 62, 247, 0.02) 0%, 
    rgba(255, 255, 255, 0) 100%
  );
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
}

.cs-tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-2);
  margin-bottom: var(--spacing-4);
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: var(--spacing-2) var(--spacing-4);
  background: var(--color-gray-100);
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-full);
  font-size: var(--size-xs);
  font-weight: 600;
  color: var(--color-gray-700);
  letter-spacing: var(--track-wide);
  text-transform: uppercase;
}

.tag.accent {
  background: var(--color-accent-light);
  border-color: var(--color-accent);
  color: var(--color-accent-dark);
}

.cs-headline {
  font-size: var(--size-5xl);
  line-height: var(--leading-tight);
  margin-bottom: var(--spacing-8);
  color: var(--color-black);
  max-width: 900px;
}

.cs-lead {
  font-size: var(--size-xl);
  line-height: var(--leading-relaxed);
  color: var(--color-gray-700);
  margin-bottom: var(--spacing-12);
  max-width: 700px;
}

.cs-hero-image {
  margin-top: var(--spacing-16);
}

/* ===================== PREMIUM HERO MOCKUP ===================== */
.hero-mockup-scene {
  position: relative;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 72px 40px 96px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

/* Premium backdrop: soft brand glow + light floor */
.hero-mockup-surface {
  position: absolute;
  inset: 0;
  border-radius: 36px;
  background:
    radial-gradient(110% 80% at 50% -10%, rgba(59,62,247,0.07) 0%, transparent 55%),
    radial-gradient(90% 60% at 50% 112%, rgba(139,92,246,0.05) 0%, transparent 60%),
    linear-gradient(180deg, #fbfbfe 0%, #f3f4f9 100%);
  box-shadow: inset 0 0 0 1px rgba(10,10,30,0.04);
  pointer-events: none;
  z-index: 0;
}

/* Composed stage */
.hero-stage {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
}

/* Grounding floor shadow */
.hero-floor-shadow {
  position: absolute;
  left: 50%;
  bottom: 52px;
  transform: translateX(-50%);
  width: 66%;
  height: 70px;
  background: radial-gradient(ellipse at center, rgba(10,10,40,0.20) 0%, rgba(10,10,40,0) 72%);
  filter: blur(10px);
  z-index: 1;
  pointer-events: none;
}

/* ---- Browser (hero focal point) ---- */
.hero-browser-frame {
  position: relative;
  z-index: 2;
  width: 86%;
  margin-right: 10%;
  border-radius: 16px;
  background: #fff;
  border: 1px solid rgba(10,10,30,0.07);
  box-shadow:
    0 2px 6px rgba(10,10,30,0.04),
    0 20px 44px -14px rgba(10,10,30,0.14),
    0 56px 100px -28px rgba(59,62,247,0.18);
  overflow: hidden;
  transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), box-shadow 0.6s ease;
}
.hero-mockup-scene:hover .hero-browser-frame {
  transform: translateY(-5px);
  box-shadow:
    0 2px 6px rgba(10,10,30,0.04),
    0 28px 56px -14px rgba(10,10,30,0.18),
    0 72px 120px -28px rgba(59,62,247,0.22);
}

.hero-browser-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 11px 15px;
  background: linear-gradient(180deg, #fafafb 0%, #f1f2f5 100%);
  border-bottom: 1px solid rgba(10,10,30,0.05);
}
.hero-browser-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.hero-browser-url {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 10px;
  padding: 5px 12px;
  background: #fff;
  border: 1px solid rgba(10,10,30,0.07);
  border-radius: 7px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--color-gray-600);
  max-width: 340px;
}
.hero-browser-lock { display: flex; align-items: center; color: var(--color-gray-400); flex-shrink: 0; }

.hero-browser-viewport {
  position: relative;
  width: 100%;
  background: #f3f4f9;
  line-height: 0;
}

/* ---- Phone (floating accent) ---- */
.hero-phone-device {
  position: absolute;
  z-index: 4;
  right: 0;
  bottom: -22px;
  width: 190px;
  background: #0e0e16;
  border-radius: 34px;
  padding: 7px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 2px 8px rgba(0,0,0,0.12),
    0 22px 48px -12px rgba(10,10,30,0.34);
  transform: rotate(-2.5deg);
  transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
}
.hero-mockup-scene:hover .hero-phone-device {
  transform: rotate(-2.5deg) translateY(-9px);
}
.hero-phone-device .phone-notch {
  position: absolute;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 68px;
  height: 18px;
  background: #0e0e16;
  border-radius: 0 0 13px 13px;
  z-index: 2;
}
.hero-phone-device .phone-screen {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 19;
  border-radius: 28px;
  overflow: hidden;
  background: #f3f4f9;
  line-height: 0;
}

/* ---- Image / graceful placeholder ---- */
.hero-browser-viewport img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: auto;
  display: block;
  object-position: top center;
}
.hero-phone-device .phone-screen img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
}
.hero-ph {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(45deg, rgba(59,62,247,0.05) 0 11px, rgba(59,62,247,0.015) 11px 22px);
}
.hero-ph span {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-gray-400);
}

/* ---- Responsive ---- */
@media (max-width: 768px) {
  .hero-mockup-scene { padding: 40px 16px 64px; }
  .hero-stage { max-width: 460px; }
  .hero-browser-frame { width: 100%; margin-right: 0; }
  .hero-phone-device { width: 132px; right: -6px; bottom: -28px; }
  .hero-floor-shadow { bottom: 30px; width: 80%; }
}


.placeholder-box {
  position: relative;
  width: 100%;
  max-width: 100%;
  display: block;
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: hidden;
}

/* ===================== BUILDER PANEL MOCKUP GRADIENT ===================== */
#mobile-panel .placeholder-box::after,
#web-panel .placeholder-box::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(59, 62, 247, 0.02) 0%, rgba(255, 255, 255, 0.01) 50%, rgba(59, 62, 247, 0.015) 100%);
  pointer-events: none;
  z-index: 3;
  border-radius: inherit;
}

/* ===================== GLASSMORPHISM FRAME ===================== */
.glassmorphism-frame {
  position: relative;
  padding: 2rem;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 24px;
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.08),
    inset 0 1px 1px rgba(255, 255, 255, 0.5),
    0 0 60px rgba(59, 62, 247, 0.08);
  animation: float-subtle 6s ease-in-out infinite;
  overflow: hidden;
}

.glassmorphism-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
  border-radius: 24px;
  pointer-events: none;
  z-index: 1;
}

.glassmorphism-frame::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at bottom right, rgba(59, 62, 247, 0.05) 0%, transparent 70%);
  border-radius: 24px;
  pointer-events: none;
  z-index: 1;
}

/* Ensure content sits above pseudo-element overlays */
.glassmorphism-frame .panel-label {
  position: relative;
  z-index: 2;
}

@keyframes float-subtle {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

.placeholder-box[data-ratio="16/9"] {
  min-height: 250px;
}

.placeholder-box[data-ratio="2/1"] {
  aspect-ratio: 2 / 1;
}

.placeholder-box[data-ratio="9/16"] {
  aspect-ratio: 9 / 16;
}

.placeholder-text {
  pointer-events: none;
}

/* ===================== SECTIONS ===================== */
.cs-section {
  padding: var(--spacing-12) var(--spacing-8);
  position: relative;
  width: 100%;
  min-width: 0;
}

.cs-grid-background {
  background-color: #fafafa;
  background-image: 
    linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  border-radius: var(--radius-lg);
  padding: var(--spacing-16);
}

.section-marker {
